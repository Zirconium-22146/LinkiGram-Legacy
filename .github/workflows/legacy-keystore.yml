name: Generate Legacy signing key

# One-off helper: produces the keystore for the Legacy build. Download the
# artifact, copy its text into the LEGACY_KEYSTORE_B64 repository secret, then
# delete the run (the artifact lives for one day).
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore legacy.keystore \
            -alias androidkey -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Linkigram Legacy, OU=Legacy, O=Linkigram, C=RU"
          echo "certificate fingerprint:"
          keytool -list -keystore legacy.keystore -alias androidkey -storepass android | grep -i "SHA" || true
          base64 -w0 legacy.keystore > legacy-keystore.b64
      - name: Upload keystore as base64
        uses: actions/upload-artifact@v4
        with:
          name: legacy-keystore-b64
          path: legacy-keystore.b64
          retention-days: 1
          if-no-files-found: error
