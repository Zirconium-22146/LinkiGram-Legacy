name: Build Linkigram Legacy (Lite)

on:
  push:
    branches: [ main, lite ]
  pull_request:
    branches: [ main, lite ]
  workflow_dispatch:
    inputs:
      arm64_only:
        description: 'Build ARM64-only APK (smaller, faster)'
        type: boolean
        default: false

concurrency:
  group: build-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      LITE_BUILD: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The GitHub runner already ships a working Android SDK. android-actions/setup-android
      # is intentionally not used: it tries to install the legacy "tools" package, which
      # Google has removed from its repository and which makes the whole step fail.
      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create private.properties
        run: |
          mkdir -p TMessagesProj/config
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.keystore
            cp release.keystore TMessagesProj/config/release.keystore
          fi
          cat > private.properties << 'EOF'
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_AUTH_CLIENT_ID=${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
          GOOGLE_SAFETYNET_KEY=${{ secrets.GOOGLE_SAFETYNET_KEY }}
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          HUAWEI_APP_ID=${{ secrets.HUAWEI_APP_ID }}
          NIMARKO_UPDATE_ENDPOINT=${{ secrets.NIMARKO_UPDATE_ENDPOINT }}
          NIMARKO_MEDIA_API_URL=${{ secrets.NIMARKO_MEDIA_API_URL }}
          NIMARKO_API_BASE_URL=${{ secrets.NIMARKO_API_BASE_URL }}
          NIMARKO_BANNER_API_URL=${{ secrets.NIMARKO_BANNER_API_URL }}
          NIMARKO_BANNER_PLACEHOLDER_URL=${{ secrets.NIMARKO_BANNER_PLACEHOLDER_URL }}
          NIMARKO_INFOCARD_RATES_URL=${{ secrets.NIMARKO_INFOCARD_RATES_URL }}
          NIMARKO_ASIA_RELAY_HOST=${{ secrets.NIMARKO_ASIA_RELAY_HOST }}
          NIMARKO_SUPPORT_URL=${{ secrets.NIMARKO_SUPPORT_URL }}
          NIMARKO_TRUSTED_PLUGIN_IDS=${{ secrets.NIMARKO_TRUSTED_PLUGIN_IDS }}
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Lite Standalone APK
        run: |
          if [ "${{ inputs.arm64_only }}" = "true" ]; then
            ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone -Plite -PngArm64Only --no-daemon
          else
            ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone -Plite --no-daemon
          fi

      - name: Upload Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: linkigram-legacy-lite-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk
          if-no-files-found: error
